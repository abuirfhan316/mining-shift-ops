<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mining Shift Ops</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#0a0c10;--surface:#111318;--surface2:#181b22;--surface3:#1e2130;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e2e4ed;--muted:#6b7280;
  --amber:#f59e0b;--amber-dim:rgba(245,158,11,0.12);
  --green:#10b981;--green-dim:rgba(16,185,129,0.1);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.1);
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,0.1);
  --purple:#8b5cf6;--purple-dim:rgba(139,92,246,0.1);
  --orange:#f97316;--orange-dim:rgba(249,115,22,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:40px;width:100%;max-width:420px;}
.auth-logo{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;}
.auth-logo span{color:var(--amber);}
.auth-sub{color:var(--muted);font-size:13px;margin-bottom:28px;}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;background:var(--surface2);border-radius:8px;padding:3px;}
.auth-tab{flex:1;padding:7px;text-align:center;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;transition:all .15s;}
.auth-tab.active{background:var(--surface);color:var(--text);}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;display:block;}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--amber);}
select.form-input{cursor:pointer;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--amber);color:#000;}
.btn-primary:hover{background:#e08c00;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}
.btn-secondary:hover{background:var(--surface3);}
.btn-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,.2);}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn-full{width:100%;}
.msg{font-size:12px;margin-top:8px;text-align:center;padding:8px;border-radius:6px;}
.msg-err{background:var(--red-dim);color:var(--red);}
.msg-ok{background:var(--green-dim);color:var(--green);}
.msg-info{background:var(--blue-dim);color:var(--blue);}
.app{display:none;flex-direction:column;height:100vh;}
.app.visible{display:flex;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border2);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.logo{font-size:15px;font-weight:700;color:#fff;}
.logo span{color:var(--amber);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.user-chip{background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;font-size:12px;display:flex;align-items:center;gap:6px;}
.role-badge{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:10px;}
.role-admin{background:var(--amber-dim);color:var(--amber);}
.role-staff{background:var(--blue-dim);color:var(--blue);}
.main{display:flex;flex:1;overflow:hidden;min-height:0;}
.sidebar{width:215px;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;flex-shrink:0;overflow-y:auto;}
.sidebar-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:8px;padding:0 6px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--amber-dim);color:var(--amber);}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;display:none;}
.content{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;}
.view{padding:24px;display:none;}
.view.active{display:block;}
.view-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px;}
.view-sub{color:var(--muted);font-size:13px;margin-bottom:22px;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.month-nav{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.month-nav button{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;}
.month-nav button:hover{background:var(--surface3);}
.month-label{font-size:16px;font-weight:600;color:#fff;min-width:160px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-header{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:5px 0;text-transform:uppercase;}
.cal-day{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 6px;min-height:72px;cursor:pointer;transition:all .15s;}
.cal-day:hover{border-color:var(--amber);background:var(--surface3);}
.cal-day.other-month{opacity:.2;pointer-events:none;}
.cal-day.today{border-color:var(--amber);}
.day-num{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;}
.day-shift{font-size:12px;font-weight:700;padding:3px 7px;border-radius:5px;display:inline-block;margin-bottom:4px;}
.shift-M{background:rgba(255,214,0,.14);color:#ffe066;}
.shift-A{background:rgba(116,167,124,.18);color:#8fc99a;}
.shift-N{background:rgba(0,176,240,.16);color:#4cc3f5;}
.shift-WO{background:var(--surface3);color:var(--muted);}
.shift-AL{background:rgba(160,43,147,.18);color:#d9a8d3;}
.shift-CO,.shift-CL{background:rgba(116,167,124,.1);color:#b2d8ba;}
.shift-PH{background:var(--red-dim);color:var(--red);}
.shift-other{background:var(--surface3);color:var(--muted);}
.staff-table{width:100%;border-collapse:collapse;font-size:13px;}
.staff-table th{padding:10px 14px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border2);background:var(--surface2);}
.staff-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
.staff-table tr:hover td{background:rgba(255,255,255,.02);}
.builder-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.builder-actions{display:flex;gap:8px;flex-wrap:wrap;}
.builder-table{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap;width:max-content;min-width:100%;}
.builder-table th,.builder-table td{border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);text-align:center;}
.builder-table th{background:var(--surface3);font-size:10px;color:var(--muted);font-weight:600;position:sticky;top:0;z-index:3;padding:6px 5px;}
.builder-table td{background:var(--surface);padding:0;min-width:92px;height:54px;}
.builder-cell{width:100%;height:54px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:11px;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;}
.builder-cell:hover{outline:1px solid var(--amber);outline-offset:-1px;background:rgba(245,158,11,.08);}
.builder-cell.shift-M{color:#ffe066;background:rgba(255,214,0,.14);}
.builder-cell.shift-A{color:#8fc99a;background:rgba(116,167,124,.18);}
.builder-cell.shift-N{color:#4cc3f5;background:rgba(0,176,240,.16);}
.builder-cell.shift-WO{color:var(--muted);background:var(--surface3);}
.builder-cell.shift-AL{color:#d9a8d3;background:rgba(160,43,147,.18);}
.builder-cell.shift-PH,.builder-cell.shift-Holiday{color:var(--red);background:var(--red-dim);}
.builder-cell.shift-CL,.builder-cell.shift-SL,.builder-cell.shift-CO{color:#b2d8ba;background:rgba(116,167,124,.1);}
.builder-select{position:fixed;z-index:300;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.4);display:none;min-width:170px;}
.builder-select.open{display:block;}
.builder-option{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;}
.builder-option:hover{background:var(--surface2);}
.builder-option.clear-opt{color:var(--red);}
.builder-option.clear-opt:hover{background:var(--red-dim);}
.balance-input{width:72px;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:6px 8px;text-align:center;}
.balance-input:focus{outline:none;border-color:var(--amber);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:15px;font-weight:600;color:#fff;}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;}
.modal-body{padding:18px 22px;}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px;min-width:260px;animation:slideIn .2s ease;}
.toast.success{border-left:3px solid var(--green);}
.toast.error{border-left:3px solid var(--red);}
.toast.info{border-left:3px solid var(--blue);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty-state{text-align:center;padding:48px 24px;color:var(--muted);}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--amber);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- AUTH -->
<div class="auth-wrap" id="authWrap">
  <div class="auth-card">
    <div class="auth-logo">Mining<span>Shift</span></div>
    <div class="auth-sub">Team schedule & leave management</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="showTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="showTab('register')">Register</button>
    </div>
    <div id="panel-login">
      <div class="form-group">

    </div>

      <div class="form-group">
        <label class="form-label">Full Name</label>
        <select class="form-input" id="regName">
          <option value="">Select your name...</option>
          <option>Abu Irfhan</option>
          <option>Muhammad Imran</option>

          <option>Nahuman Mujeeb</option>

          <option>Jayson Optana</option>

          <option>Ernanie Datu</option>
          <option>Mohammed Eisam</option>
          <option>Erick Sinforoso</option>
          <option>Richard Campus</option>
          <option>Jefferson Morales</option>
          <option>Ronjie Dane</option>
          <option>Saif</option>
          <option>Sheick</option>
          <option>Ragesh Umapathy</option>
          <option>Shamlan Kandan</option>
          <option>Arun David</option>
          <option>Norman Abaño</option>
          <option>Aguinaldo</option>
          <option>Niño Malaiba</option>
          <option>Bala</option>
          <option>Shyam</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="regUser" placeholder="e.g. june.escober">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="regPass" placeholder="Min 6 characters">

      <button class="btn btn-primary btn-full" onclick="register()">Submit Registration</button>
    </div>

</div>

<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <div class="logo">Mining<span>Shift</span></div>
    <div class="topbar-right">
      <div class="user-chip">
        <span id="topbarName">Abu Irfhan</span>
        <span class="role-badge role-admin" id="topbarRole">Admin</span>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="switchView('changepass')">🔑 Password</button>
      <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-label">Menu</div>
      <button class="nav-item active" id="nav-calendar" onclick="switchView('calendar')">📅 My Schedule</button>
      <button class="nav-item" id="nav-apply" onclick="switchView('apply')">📝 Apply Leave</button>
      <button class="nav-item" id="nav-balances" onclick="switchView('balances')">🧮 Leave Balances</button>
      <button class="nav-item" id="nav-team" onclick="switchView('team')">👥 Team Schedule</button>
      <div id="adminNav">
        <div class="divider"></div>
        <div class="sidebar-label">Admin</div>
        <button class="nav-item" id="nav-pending" onclick="switchView('pending')">⏳ Pending Requests</button>
        <button class="nav-item" id="nav-builder" onclick="switchView('builder')">🗓 Schedule Builder</button>
        <button class="nav-item" id="nav-staff" onclick="switchView('staff')">👤 Staff Accounts</button>
      </div>
    </div>
    <div class="content">

      <!-- LEAVE BALANCES -->
      <div class="view" id="view-balances">
        <div class="view-title">Staff Leave Balances</div>
        <div class="view-sub">Standard entitlement: 30 Days (Jan 1 – Dec 30). Used days deduct only after approval and vacation start.</div>
        <div id="balanceContent"></div>
      </div>

      <!-- SCHEDULE BUILDER -->
      <div class="view" id="view-builder">
        <div class="builder-toolbar">
          <div>
            <div class="view-title">Schedule Builder</div>
            <div class="view-sub">Select shift: Morning, Afternoon, Overnight, Day Off, or Clear.</div>
          </div>
        </div>
        <div id="builderContent"></div>
      </div>

    </div>
  </div>
</div>

<!-- FLOATING BUILDER SHIFT SELECTOR -->
<div class="builder-select" id="builderSelect">
  <button class="builder-option" onclick="applyShift('M')">Morning (M)</button>
  <button class="builder-option" onclick="applyShift('A')">Afternoon (A)</button>
  <button class="builder-option" onclick="applyShift('N')">Overnight (N)</button>
  <button class="builder-option" onclick="applyShift('WO')">Day Off (WO)</button>
  <button class="builder-option" onclick="applyShift('AL')">Annual Leave (AL)</button>
  <button class="builder-option clear-opt" onclick="applyShift('')">Clear (No Shift)</button>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
let currentCell = null;

function renderBuilderSelect() {
  document.querySelectorAll('.builder-cell').forEach(cell => {
    cell.addEventListener('click', (e) => {
      e.stopPropagation();
      currentCell = cell;
      const select = document.getElementById('builderSelect');
      select.style.top = `${e.clientY + 5}px`;
      select.style.left = `${e.clientX + 5}px`;
      select.classList.add('open');
    });
  });
}

function applyShift(code) {
  if (currentCell) {
    currentCell.className = 'builder-cell ' + (code ? 'shift-' + code : '');
    currentCell.innerText = code ? code : '';
  }
  document.getElementById('builderSelect').classList.remove('open');
}

window.addEventListener('click', () => {
  document.getElementById('builderSelect').classList.remove('open');
});

function loadLeaveBalancesTable() {
  const staffMembers = [
    { name: "Abu Irfhan", clExtra: 2, alExtra: 0, usedAL: 5, usedCL: 0 },
    { name: "Muhammad Imran", clExtra: 0, alExtra: 5, usedAL: 10, usedCL: 3 },
    { name: "June Escober", clExtra: 1, alExtra: 0, usedAL: 0, usedCL: 0 }
  ];

  let html = `
    <table class="staff-table">
      <thead>
        <tr>
          <th>Staff Name</th>
          <th>Base Annual Leave</th>
          <th>Admin Entitle (AL)</th>
          <th>Admin Entitle (CL)</th>
          <th>Deducted / Used AL</th>
          <th>Total Remaining Balance</th>
        </tr>
      </thead>
      <tbody>
  `;

  staffMembers.forEach(s => {
    const totalAL = 30 + s.alExtra - s.usedAL;
    html += `
      <tr>
        <td><strong>${s.name}</strong></td>
        <td>30 Days</td>
        <td><input class="balance-input" type="number" value="${s.alExtra}"></td>
        <td><input class="balance-input" type="number" value="${s.clExtra}"></td>
        <td>${s.usedAL} Days</td>
        <td><strong style="color:var(--green);">${totalAL} Days AL</strong> (${s.clExtra} Days CL)</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  document.getElementById('balanceContent').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', () => {
  loadLeaveBalancesTable();
  renderBuilderSelect();
});
</script>
</body>
</html>
